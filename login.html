<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · DX Needed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8590c'/%3E%3Cpath d='M9 17a7 7 0 0 1 14 0M12 17a4 4 0 0 1 8 0' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='18' r='1.8' fill='white'/%3E%3C/svg%3E">
<style>
  :root { --bg: #f6f4ef; --panel: #fff; --ink: #1d1f22; --muted: #6b6f76; --line: #e3e0d8; --accent: #e8590c; --bad: #d6336c; --bad-bg: #fdecf2;
          --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171a; --panel: #1d2024; --ink: #e9e7e2; --muted: #a0a5ad; --line: #2e3238; --bad: #ff6b9a; --bad-bg: #3a1d28; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); padding: 20px; }
  form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px 24px; }
  .top { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
  .top svg { width: 34px; height: 34px; }
  h1 { font-size: 19px; margin: 0; } h1 small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
  label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
  input { font: 15px var(--sans); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px 11px; }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { margin-top: 14px; width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: 600 15px var(--sans); cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { margin-top: 12px; font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--bad-bg); color: var(--bad); }
  p.help { margin: 14px 0 0; font-size: 12px; color: var(--muted); }
  p.help code { font-size: 11.5px; }
</style>
</head>
<body>
<form id="f">
  <div class="top">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#e8590c"/><path d="M9 17a7 7 0 0 1 14 0M12 17a4 4 0 0 1 8 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="16" cy="18" r="1.8" fill="#fff"/></svg>
    <h1>DX Needed <small>Sign in to continue</small></h1>
  </div>
  <label>Admin password <input type="password" id="pw" autocomplete="current-password" autofocus required></label>
  <button type="submit" id="go">Sign in</button>
  <div class="err" id="err" hidden></div>
  <p class="help">Forgot it? On the server run<br><code>docker exec -it wavelog-dx-checker python settings.py reset-password</code></p>
</form>
<script>
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const b = document.getElementById("go"), err = document.getElementById("err");
    b.disabled = true; err.hidden = true;
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("pw").value }) });
      if (r.ok) { location.href = "/"; return; }
      const j = await r.json().catch(() => ({}));
      err.textContent = j.error || "Couldn't sign in."; err.hidden = false;
    } catch { err.textContent = "Can't reach the server."; err.hidden = false; }
    b.disabled = false;
  });
</script>
</body>
</html>
